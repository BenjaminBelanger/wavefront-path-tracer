# CMake workflow with CUDA support
name: CMake with CUDA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-22.04  # Use Ubuntu 22.04 for better CUDA support
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install CUDA Toolkit
      uses: Jimver/cuda-toolkit@v0.2.16  # Updated version
      id: cuda-toolkit
      with:
        cuda: '12.2.0'
        method: 'network'
        sub-packages: '["nvcc", "cudart"]'
    
    - name: Verify CUDA installation
      run: |
        nvcc --version
        echo "CUDA_PATH: $CUDA_PATH"
    
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake
    
    - name: Configure CMake
      run: |
        cmake -B ${{github.workspace}}/build \
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DCMAKE_CUDA_COMPILER=$CUDA_PATH/bin/nvcc \
          -DCMAKE_CUDA_ARCHITECTURES="60;70;75;80;86"
      env:
        CUDACXX: ${{ steps.cuda-toolkit.outputs.CUDA_PATH }}/bin/nvcc
    
    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} -j$(nproc)
    
    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure
